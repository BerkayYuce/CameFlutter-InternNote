name: login_page_flutter
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.0
  dio: ^5.8.0+1
  http: ^0.13.6
  shared_preferences: ^2.2.0
  email_validator: ^3.0.0
  parse_server_sdk_flutter: ^8.0.0
  device_info_plus: ^9.0.0
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  intl: ^0.18.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/ozak_logo.jpg"

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9 # Kod üreticisini çalıştırmak için temel araç
  freezed: ^2.4.7 # Freezed kod üreteci paketi
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/ozak_logo.jpg

